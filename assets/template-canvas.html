<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOON明月 · 可编辑无限画布</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--o:#bc4528;--p:#F4F1ED;--t:#5D4E47;--m:#8A8178;--d:#3D342F}body{font-family:'Arial Unicode MS','Arial Unicode','Noto Sans SC',sans-serif;background:#2C2420;overflow:hidden;height:100vh;cursor:grab;user-select:none}.canvas{position:absolute;top:0;left:0;width:5200px;height:4200px;transform-origin:0 0;background:var(--p);background-image:radial-gradient(rgba(93,78,71,.015) 1px,transparent 1px);background-size:4px 4px}.smooth{transition:transform .35s cubic-bezier(.25,.1,.25,1)}svg{position:absolute;inset:0;pointer-events:none}.zones,.nodes{position:absolute;inset:0}.zones{pointer-events:none}.zone{position:absolute;font-size:13px;font-weight:700;color:var(--m);letter-spacing:.08em;text-transform:uppercase;opacity:.55}.zone:after{content:'';display:block;width:32px;height:1px;background:var(--o);opacity:.25;margin-top:4px}.node{position:absolute;border-radius:14px;z-index:2;pointer-events:auto;touch-action:none;box-shadow:0 2px 16px rgba(0,0,0,.04)}.node:hover{box-shadow:0 8px 28px rgba(0,0,0,.1)}.sel{outline:2px solid rgba(188,69,40,.42);outline-offset:4px}.pending{outline:2px dashed rgba(188,69,40,.65);outline-offset:6px}.handle,.del{position:absolute;top:9px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.36);color:rgba(93,78,71,.4);cursor:pointer}.handle{right:9px;cursor:move}.del{right:37px;border:0;font-size:15px}.del:hover{color:#bc4528;background:rgba(188,69,40,.08)}.edit{outline:0;border-radius:6px;cursor:text;user-select:text}.edit:focus{background:rgba(188,69,40,.07);box-shadow:0 0 0 4px rgba(188,69,40,.06)}.hero{width:410px;padding:44px 40px;color:var(--p);border-radius:20px;background:linear-gradient(135deg,var(--o),#a93e24);box-shadow:0 12px 40px rgba(188,69,40,.2)}.hero .handle,.result .handle,.hero .del,.result .del{background:rgba(244,241,237,.12);color:rgba(244,241,237,.55)}.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;padding:4px 12px;border:1.5px solid rgba(244,241,237,.32);border-radius:20px;margin-bottom:20px}.hero h1{font-size:34px;font-weight:900;line-height:1.25;margin-bottom:12px;padding-right:28px}.body{font-size:12px;color:var(--m);line-height:1.65}.hero .body{font-size:14px;color:var(--p);opacity:.78}.step{width:250px;background:var(--p);border-top:4px solid var(--o);padding:28px 24px}.num{font-size:44px;color:rgba(188,69,40,.12);line-height:1;margin-bottom:6px}.step h3,.warn h3{font-size:15px;font-weight:800;color:var(--t);margin-bottom:6px;padding-right:28px}.quote{width:310px;background:rgba(188,69,40,.035);border:1px solid rgba(188,69,40,.08);padding:26px 28px;text-align:center}.quote h3{font-size:13px;font-weight:800;color:var(--o);margin-bottom:10px}.quote .body{font-size:15px;font-weight:500;color:var(--t);line-height:1.8}.warn{width:275px;background:#FEF9F4;border-left:4px solid #E84A5F;padding:24px 22px}.branch{width:270px;background:var(--p);padding:28px 24px;overflow:hidden}.branch:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--o)}.branch.alt:before{background:#8B1E3F}.branch h3{font-size:17px;font-weight:900;color:var(--o);margin:10px 0 6px;padding-right:28px}.branch.alt h3{color:#8B1E3F}.result{width:380px;background:var(--d);padding:32px 28px;color:var(--p)}.result h3{font-size:15px;font-weight:800;color:#E8C4B0;margin-bottom:12px;padding-right:28px}.result .body{color:rgba(244,241,237,.76)}.conn{fill:none;stroke:rgba(188,69,40,.22);stroke-width:1.6;stroke-linecap:round;pointer-events:stroke;cursor:pointer}.edge-sel{stroke:var(--o);stroke-width:3}.conn.edge-sel{stroke:rgba(188,69,40,.72);stroke-width:3}.dashed{stroke-dasharray:7 6}.soft{stroke:rgba(188,69,40,.13);stroke-dasharray:4 8}.cl{font-size:11px;fill:rgba(93,78,71,.48);font-weight:600;paint-order:stroke;stroke:var(--p);stroke-width:4px}.bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(61,52,47,.92);border-radius:14px;padding:7px;z-index:9}.bar button{height:34px;border:0;border-radius:8px;background:transparent;color:rgba(244,241,237,.65);padding:0 10px;cursor:pointer}.bar button:hover,.bar .on{background:rgba(255,255,255,.08);color:var(--p)}.zl{font-size:11px;color:rgba(244,241,237,.55);min-width:42px;display:grid;place-items:center}.hint,.status{position:fixed;left:50%;transform:translateX(-50%);z-index:9;font-size:12px;pointer-events:none}.hint{top:24px;color:rgba(244,241,237,.42)}.status{top:50px;color:rgba(244,241,237,.75);background:rgba(61,52,47,.72);padding:6px 12px;border-radius:99px;opacity:0}.show{opacity:1}
</style></head><body><div id="hint" class="hint">拖空白平移 · 滚轮缩放 · 拖节点右上角移动 · 双击文字编辑</div><div id="status" class="status">已保存</div><div id="cv" class="canvas"><svg id="svg" width="5200" height="4200"></svg><div id="zones" class="zones"></div><div id="nodes" class="nodes"></div></div><div class="bar"><button onclick="zo(.9)">−</button><span id="zl" class="zl">100%</span><button onclick="zo(1.1)">+</button><button onclick="home()">复位</button><button onclick="add()">+节点</button><button id="cb" onclick="conn()">连接</button><button onclick="resetData()">重置</button></div><script>
const K='moonSkillCanvasV2',cv=document.getElementById('cv'),svg=document.getElementById('svg'),NE=document.getElementById('nodes'),ZE=document.getElementById('zones'),ZL=document.getElementById('zl'),ST=document.getElementById('status'),CB=document.getElementById('cb'),HI=document.getElementById('hint');
const base={zones:[["WHY",1440,520],["BUILD FLOW",1400,1120],["KEY PARTS",2360,1120],["TEST",1500,1960],["OUTPUT",2260,2520]],nodes:[["hero","hero",2100,600,"如何打造自己的专属 Skill","把你的审美、流程和经验写成 AI 能稳定执行的规则，而不是每次重新解释。","MOON SKILL"],["why","quote",1460,680,"核心认知","Skill 不是提示词合集，而是一套可复用的工作流、规范、模板和检查清单。","Dr. Moon"],["s1","step",1320,1240,"定义使用场景","先说明它解决什么问题：网页、图文、海报、代码、自动化，越具体越好。","01"],["s2","step",1640,1240,"写清触发条件","告诉 AI 什么情况下自动调用：用户说什么、给什么材料、期待什么交付。","02"],["s3","step",1960,1240,"设计工作流","把过程拆成澄清、读规范、选模板、生成、检查、交付，不要只写风格形容词。","03"],["c1","branch",2380,1260,"品牌 DNA","颜色、字体、语气、禁忌和自检问题，是保持风格一致的底层规则。",""],["c2","branch alt",2700,1260,"模板资产","HTML 模板、组件片段、示例文件，让 AI 从可用骨架开始改，而不是从零乱写。",""],["c3","branch",2380,1640,"检查清单","P0 必须过，P1 提升质量，P2 做加分。清单决定输出是否稳定。",""],["w1","warn",1500,2040,"不要空跑","用真实内容测试 Skill。看它是否能覆盖核心信息、保持风格、避免模板味。",""],["w2","warn",1840,2040,"不要过度设计","先做最小可用版本，再根据实际输出补规则。复杂不是专业，稳定才是。",""],["r1","result",2220,2580,"最终产出","一个包含 SKILL.md、brand-dna、模板、组件、场景规范和 checklist 的个人 AI 生产系统。",""]],edges:[["hero","why","soft","为什么"],["hero","s1","dashed","开始"],["s1","s2",""],["s2","s3",""],["s3","c1","dashed","沉淀"],["s3","c2","dashed"],["c1","c3","soft"],["c2","c3","soft"],["c3","w1","dashed","验证"],["w1","w2",""],["w2","r1","dashed","交付"],["c3","r1","soft"]]};
let data=load(),sc=1,tx=0,ty=0,pan=0,px=0,py=0,drag=null,link=0,from=null,timer=0,selNode=null,selEdge=-1;function load(){try{let v=JSON.parse(localStorage.getItem(K));return v&&Array.isArray(v.nodes)&&v.nodes.length? v:JSON.parse(JSON.stringify(base))}catch{return JSON.parse(JSON.stringify(base))}}function save(){clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem(K,JSON.stringify(data));tip('已保存')},160)}function tip(t){ST.textContent=t;ST.classList.add('show');setTimeout(()=>ST.classList.remove('show'),900)}function node(id){return data.nodes.find(n=>n[0]==id)}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){ZE.innerHTML='';data.zones.forEach(z=>{let e=document.createElement('div');e.className='zone';e.textContent=z[0];e.style.left=z[1]+'px';e.style.top=z[2]+'px';ZE.appendChild(e)});NE.innerHTML='';data.nodes.forEach(n=>NE.appendChild(make(n)));draw()}function make(n){let e=document.createElement('article'),type=n[1].split(' ')[0];e.className='node '+n[1];e.dataset.id=n[0];e.style.left=n[2]+'px';e.style.top=n[3]+'px';let h='<button class="del" title="删除节点">×</button><span class="handle">↕</span>'; if(type=='hero')e.innerHTML=`${h}<div class="badge edit" data-i="6">${esc(n[6])}</div><h1 class="edit" data-i="4">${esc(n[4])}</h1><div class="body edit" data-i="5">${esc(n[5])}</div>`;else if(type=='step')e.innerHTML=`${h}<div class="num edit" data-i="6">${esc(n[6])}</div><h3 class="edit" data-i="4">${esc(n[4])}</h3><div class="body edit" data-i="5">${esc(n[5])}</div>`;else if(type=='quote')e.innerHTML=`${h}<h3 class="edit" data-i="4">${esc(n[4])}</h3><div class="body edit" data-i="5">${esc(n[5])}</div><div class="edit" data-i="6" style="font-size:11px;color:#8A8178;margin-top:10px">${esc(n[6])}</div>`;else e.innerHTML=`${h}<h3 class="edit" data-i="4">${esc(n[4])}</h3><div class="body edit" data-i="5">${esc(n[5])}</div>`;e.onpointerdown=down;e.onclick=clickNode;e.querySelector('.del').onclick=ev=>{ev.stopPropagation();delNode(n[0])};e.querySelectorAll('[data-i]').forEach(f=>{f.contentEditable='true';f.spellcheck=false;f.oninput=()=>{node(n[0])[f.dataset.i]=f.textContent.trim();save()};f.onpointerdown=ev=>ev.stopPropagation();f.onpaste=ev=>{ev.preventDefault();document.execCommand('insertText',0,(ev.clipboardData||window.clipboardData).getData('text/plain'))}});return e}
function draw(){svg.innerHTML='';data.edges.forEach(ed=>{let a=node(ed[0]),b=node(ed[1]),ea=NE.querySelector(`[data-id="${ed[0]}"]`),eb=NE.querySelector(`[data-id="${ed[1]}"]`);if(!a||!b||!ea||!eb)return;let A=box(a,ea),B=box(b,eb),p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path(A,B));p.setAttribute('class','conn '+ed[2]+(data.edges.indexOf(ed)==selEdge?' edge-sel':''));p.onclick=ev=>{ev.stopPropagation();selEdge=data.edges.indexOf(ed);sel(null);draw();tip('已选中连接：Delete 删除，1/2/3 改线型，L 改标签')};svg.appendChild(p);if(ed[3]){let l=document.createElementNS('http://www.w3.org/2000/svg','text');l.setAttribute('x',(A.cx+B.cx)/2);l.setAttribute('y',(A.cy+B.cy)/2-8);l.setAttribute('text-anchor','middle');l.setAttribute('class','cl');l.textContent=ed[3];svg.appendChild(l)}})}function box(n,e){let w=e.offsetWidth||260,h=e.offsetHeight||160;return{x:n[2],y:n[3],w,h,cx:n[2]+w/2,cy:n[3]+h/2}}function path(a,b){if(Math.abs(b.cx-a.cx)>Math.abs(b.cy-a.cy)){let sx=a.cx<b.cx?a.x+a.w:a.x,ex=a.cx<b.cx?b.x:b.x+b.w,sy=a.cy,ey=b.cy,m=(sx+ex)/2;return`M${sx} ${sy}C${m} ${sy} ${m} ${ey} ${ex} ${ey}`}let sx=a.cx,ex=b.cx,sy=a.cy<b.cy?a.y+a.h:a.y,ey=a.cy<b.cy?b.y:b.y+b.h,m=(sy+ey)/2;return`M${sx} ${sy}C${sx} ${m} ${ex} ${m} ${ex} ${ey}`}
function down(e){if(e.target.closest('[contenteditable=true]'))return;let el=e.currentTarget,n=node(el.dataset.id);e.preventDefault();e.stopPropagation();drag=[n,e.clientX,e.clientY,n[2],n[3],el];sel(n[0]);HI.style.opacity=0}function clickNode(e){let id=e.currentTarget.dataset.id;sel(id);if(!link)return;e.stopPropagation();if(!from){from=id;e.currentTarget.classList.add('pending');tip('请选择第二个节点');return}if(from!=id){data.edges.push([from,id,'dashed','']);draw();save();tip('已创建连接')}clearConn()}function sel(id){selNode=id;selEdge=-1;NE.querySelectorAll('.node').forEach(e=>e.classList.toggle('sel',e.dataset.id==id));draw()}function delNode(id){if(!confirm('删除这个节点及相关连接吗？'))return;data.nodes=data.nodes.filter(n=>n[0]!=id);data.edges=data.edges.filter(e=>e[0]!=id&&e[1]!=id);selNode=null;render();save();tip('已删除节点')}function delEdge(){if(selEdge<0)return;data.edges.splice(selEdge,1);selEdge=-1;draw();save();tip('已删除连接')}function setEdgeType(t){if(selEdge<0)return;data.edges[selEdge][2]=t;draw();save();tip('已修改连接类型')}function labelEdge(){if(selEdge<0)return;let v=prompt('连接标签（留空则删除标签）',data.edges[selEdge][3]||'');if(v===null)return;data.edges[selEdge][3]=v.trim();draw();save();tip('已修改连接标签')}function dupNode(){if(!selNode)return;let n=node(selNode);if(!n)return;let cp=JSON.parse(JSON.stringify(n));cp[0]='n'+Date.now();cp[2]+=40;cp[3]+=40;cp[4]+=' 副本';data.nodes.push(cp);render();sel(cp[0]);save();tip('已复制节点')}
document.onpointermove=e=>{if(drag){let n=drag[0];n[2]=drag[3]+(e.clientX-drag[1])/sc;n[3]=drag[4]+(e.clientY-drag[2])/sc;drag[5].style.left=n[2]+'px';drag[5].style.top=n[3]+'px';draw();return}if(pan){tx=e.clientX-px;ty=e.clientY-py;apply(0)}};document.onpointerup=()=>{if(drag){drag=null;save()}pan=0;document.body.classList.remove('grabbing')};document.onpointerdown=e=>{if(e.target.closest('.node')||e.target.closest('.bar'))return;pan=1;px=e.clientX-tx;py=e.clientY-ty;document.body.classList.add('grabbing');HI.style.opacity=0;if(link)clearConn();selEdge=-1;draw()};document.addEventListener('wheel',e=>{e.preventDefault();zoom(e.clientX,e.clientY,e.deltaY<0?1.08:.92)},{passive:false});
function apply(s){cv.classList.toggle('smooth',!!s);cv.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;ZL.textContent=Math.round(sc*100)+'%';if(s)setTimeout(()=>cv.classList.remove('smooth'),360)}function zoom(x,y,f){let ns=Math.min(Math.max(sc*f,.18),2.5),r=ns/sc;tx=x-(x-tx)*r;ty=y-(y-ty)*r;sc=ns;apply(1)}function zo(f){zoom(innerWidth/2,innerHeight/2,f)}function home(){let h=node('hero')||data.nodes[0];sc=.58;tx=innerWidth/2-(h[2]+80)*sc;ty=innerHeight/2-(h[3]+520)*sc;apply(1)}function add(){let id='n'+Date.now(),x=(innerWidth/2-tx)/sc-125,y=(innerHeight/2-ty)/sc-80,i=data.nodes.filter(n=>n[1].startsWith('step')).length+1;data.nodes.push([id,'step',x,y,'新节点','双击文字编辑内容。',String(i).padStart(2,'0')]);render();sel(id);save();tip('已添加节点')}function conn(){link=!link;CB.classList.toggle('on',link);from=null;tip(link?'点击两个节点建立连接':'已退出连接模式')}function clearConn(){link=0;from=null;CB.classList.remove('on');NE.querySelectorAll('.pending').forEach(e=>e.classList.remove('pending'))}function resetData(){if(!confirm('确定重置画布内容和节点位置吗？'))return;localStorage.removeItem(K);data=JSON.parse(JSON.stringify(base));render();home();tip('已重置')}document.onkeydown=e=>{if(e.key=='Escape')clearConn();if(e.key=='Delete'||e.key=='Backspace'){if(selEdge>=0){e.preventDefault();delEdge()}}if(selEdge>=0&&['1','2','3'].includes(e.key)){e.preventDefault();setEdgeType(e.key=='1'?'':e.key=='2'?'dashed':'soft')}if(selEdge>=0&&e.key.toLowerCase()=='l'){e.preventDefault();labelEdge()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='d'){e.preventDefault();dupNode()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='s'){e.preventDefault();localStorage.setItem(K,JSON.stringify(data));tip('已保存')}};render();home();
</script></body></html>
